name: Deploy archive website to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "website/**"
      - "archived-references/manifest.json"
      - "archived-references/md/**"
      - "archived-references/pdf/**"
      - "original-listings/**"
      - "*.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out archive
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Generate synchronized website data
        run: node website/build-data.mjs

      - name: Validate production JavaScript and generated data
        run: |
          node --check website/app.js
          node --check website/constellation.js
          node --check website/build-data.mjs
          node --check website/build-site.mjs
          node website/build-data.mjs --check

      - name: Stage the site root and preserved documents
        run: |
          node website/build-site.mjs --target github --output _site
          test -f _site/index.html
          test "$(du -sb _site | cut -f1)" -lt 1000000000
          du -sh _site

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
